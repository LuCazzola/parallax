name: docs

on:
  push:
    branches: [{{default_branch}}]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 docs/agent-guide/check_docs.py
      - run: >
          pip install mkdocs==1.6.1 mkdocs-material==9.7.7 mkdocstrings==1.0.6
          mkdocstrings-python==2.0.9 griffe==2.3.0 mkdocs-autorefs==1.4.4 pymdown-extensions==11.0.2
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
