services:
  docs:
    image: ghcr.io/astral-sh/uv:0.9.30-python3.12-bookworm-slim
    working_dir: /docs
    volumes:
      - ../..:/docs:ro
      - uv-cache:/root/.cache/uv
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - NO_MKDOCS_2_WARNING=1
    command: >
      uvx --with-requirements docs/parallax/requirements.txt
      mkdocs serve -f docs/parallax/mkdocs.yml --dev-addr 0.0.0.0:8000 --livereload

volumes:
  uv-cache:
